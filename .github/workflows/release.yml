name: Release and Publish

on:
  push:
    tags:
      - "release/**"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example release/v21.0.0"
        required: true
        type: string

jobs:
  create_release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag commit is on main
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          case "${TAG_NAME}" in
            release/v*) ;;
            *)
              echo "Tag must start with release/v"
              exit 1
              ;;
          esac
          git fetch origin main --depth=1
          git fetch --tags --force
          TAG_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"
          if ! git branch -r --contains "${TAG_COMMIT}" | grep -q "origin/main"; then
            echo "Tag ${TAG_NAME} does not point to a commit on origin/main"
            exit 1
          fi
          echo "RELEASE_NAME=${TAG_NAME#release/}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --generate-notes \
            --verify-tag

  publish:
    name: publish to pypi
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Verify distribution versions match release tag
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path

          from packaging.utils import parse_sdist_filename, parse_wheel_filename
          from packaging.version import Version

          tag = os.environ['TAG_NAME']
          if not tag.startswith('release/v'):
              raise SystemExit(f'Invalid release tag: {tag}')
          expected = Version(tag.removeprefix('release/v'))
          wheels = list(Path('dist').glob('*.whl'))
          sdists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit('Expected exactly one wheel and one source distribution')
          for path in wheels + sdists:
              if path.suffix == '.whl':
                  filename_version = parse_wheel_filename(path.name)[1]
                  with zipfile.ZipFile(path) as archive:
                      metadata, = [n for n in archive.namelist() if n.endswith('.dist-info/METADATA')]
                      content = archive.read(metadata)
              else:
                  filename_version = parse_sdist_filename(path.name)[1]
                  with tarfile.open(path) as archive:
                      metadata, = [m for m in archive.getmembers()
                                   if m.name.count('/') == 1 and m.name.endswith('/PKG-INFO')]
                      content = archive.extractfile(metadata).read()
              versions = BytesParser().parsebytes(content).get_all('Version', [])
              if len(versions) != 1 or Version(versions[0]) != expected or filename_version != expected:
                  raise SystemExit(f'{tag} does not match {path.name}: metadata Version={versions}')
              print(f'{path.name}: version matches {tag}')
          PY

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
